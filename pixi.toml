[workspace]
authors = ["WouterDX <wouter.dierckx@gmail.com>"]
channels = ["conda-forge"]
name = "propopemailaccess"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
review-frontend = "python src/review_frontend.py"

[dependencies]
python = ">=3.14.6,<3.15"
pip = ">=26.2.1,<27"
google-api-python-client = ">=2.198.0,<3"
